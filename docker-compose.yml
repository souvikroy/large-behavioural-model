version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: question-quest-api
    ports:
      - "9010:9010"
    volumes:
      # Mount data file
      - ./question-response.json:/app/question-response.json:ro
      # Persist trained models
      - ./models:/app/models
      # Persist knowledge graphs
      - ./knowledge_graphs:/app/knowledge_graphs
      # Application logs
      - ./logs:/app/logs
      # Mount config for easy updates
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
